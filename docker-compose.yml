# Local, "prod-like" backend run: `docker compose up --build`. Not a deployment target itself
# -- see README.md "Deployment" for Render, the recommended path. The Streamlit UI (`app.py`)
# runs separately with `streamlit run app.py` -- it isn't containerized here.
#
# Secrets are injected at container *run* time only, via `env_file`/`environment` below --
# never copied into the image (see Dockerfile / .dockerignore).
services:
  backend:
    build:
      context: .
      dockerfile: Dockerfile
    ports:
      - "8000:8000"
    env_file:
      - .env # OPENAI_API_KEY / OPENAI_MODEL -- copy .env.example to .env first
