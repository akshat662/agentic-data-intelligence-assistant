[project]
name = "adia"
version = "0.1.0"
description = "Agentic Data Intelligence Assistant (ADIA) - a LangGraph-based agentic data analysis system with deterministic tool execution."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "ADIA Author" }]

dependencies = [
    # Core
    "pydantic>=2.0",
    "python-dotenv>=1.0",
    # Data layer
    "pandas>=2.0",
    "numpy>=1.26",
    "duckdb>=1.0",
    "pyarrow>=16.0",
    # SQL parsing / guarding
    "sqlglot>=25.0",
    # Machine learning
    "scikit-learn>=1.4",
    # Orchestration
    "langgraph>=0.2",
    "langchain-openai>=0.2",
    "fastapi>=0.141.1",
    "uvicorn[standard]>=0.52.4",
    "python-multipart>=0.0.32",
]

[dependency-groups]
dev = [
    # Testing
    "pytest>=8.0",
    "pytest-cov>=5.0",
    # Code quality
    "ruff>=0.6",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["adia"]

[tool.pytest.ini_options]
minversion = "8.0"
addopts = "-ra --cov=adia --cov-report=term-missing"
testpaths = ["tests"]

[tool.coverage.run]
source = ["adia"]
omit = ["*/__init__.py"]

[tool.ruff]
line-length = 100
target-version = "py311"
src = ["adia", "tests", "bench"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]
ignore = []

[tool.ruff.lint.isort]
known-first-party = ["adia"]

[tool.ruff.lint.flake8-bugbear]
# FastAPI's dependency-injection markers are designed to be called in argument defaults.
extend-immutable-calls = ["fastapi.Depends", "fastapi.Form", "fastapi.File", "fastapi.Query"]
